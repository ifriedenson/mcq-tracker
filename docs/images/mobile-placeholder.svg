<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title description">
  <title id="title">Mobile screenshot placeholder</title>
  <desc id="description">A phone outline and text explaining that a real mobile screenshot was not captured in this pass.</desc>
  <rect width="900" height="560" rx="24" fill="#f6f6f7"/>
  <rect x="46" y="44" width="808" height="472" rx="18" fill="#ffffff" stroke="#d7d7dc" stroke-width="2"/>
  <text x="80" y="102" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">PLACEHOLDER</text>
  <text x="80" y="154" fill="#1f2937" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Mobile screenshot not captured</text>
  <text x="80" y="192" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="19">This pass used desktop Obsidian 1.15.0.</text>
  <text x="80" y="226" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="19">The same views adapt to phone width. See the mobile</text>
  <text x="80" y="252" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="19">install note in the README.</text>
  <rect x="612" y="92" width="186" height="350" rx="28" fill="#fafafa" stroke="#8b5cf6" stroke-width="4"/>
  <rect x="632" y="124" width="146" height="12" rx="6" fill="#ddd6fe"/>
  <rect x="632" y="154" width="106" height="12" rx="6" fill="#e5e7eb"/>
  <rect x="632" y="188" width="146" height="74" rx="10" fill="#f3f4f6"/>
  <rect x="646" y="204" width="104" height="10" rx="5" fill="#c4b5fd"/>
  <rect x="646" y="226" width="80" height="10" rx="5" fill="#d1d5db"/>
  <rect x="632" y="282" width="146" height="44" rx="10" fill="#ede9fe"/>
  <rect x="632" y="344" width="146" height="44" rx="10" fill="#ede9fe"/>
  <rect x="668" y="414" width="74" height="8" rx="4" fill="#d1d5db"/>
  <circle cx="705" cy="110" r="4" fill="#d1d5db"/>
  <text x="80" y="360" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="15">No image shown in place of a real device capture.</text>
  <text x="80" y="386" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="15">Desktop captures in this README are from the live plugin.</text>
  <rect x="80" y="430" width="146" height="36" rx="18" fill="#ede9fe"/>
  <text x="98" y="453" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Missing: mobile</text>
</svg>
