name: Repair missing releases

# Recreates a release that was never published — a tag step that failed, or a
# version whose work was merged under a later number.
#
# This is manual on purpose. It used to run on every push to main with four
# versions hardcoded from 1.199 to 1.202, so at 1.307.x it re-checked ancient
# history on every push and could never repair the version that was actually
# missing: 1.307.20 has a notes file and a release commit but no tag and no
# release, because its branch was merged as 1.307.21. The release workflow now
# runs one job per push instead of one per repository, so a batch of pushes no
# longer cancels the middle release; a missing release is the exception, and
# naming it here is the repair.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Versions to publish, comma separated (for example 1.307.20). Each needs a commit that sets manifest.json to it and docs/release-notes/<version>.md."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: repair-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create the missing releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          set -euo pipefail
          for V in $(printf '%s' "$VERSIONS" | tr ',' ' '); do
            [ -n "$V" ] || continue
            if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "$V is not a version number."
              exit 1
            fi
            if gh release view "$V" >/dev/null 2>&1; then
              echo "Release $V already exists; nothing to repair."
              continue
            fi
            if [ ! -f "docs/release-notes/$V.md" ]; then
              echo "docs/release-notes/$V.md is missing; refusing to publish $V without notes."
              exit 1
            fi
            NOTES="$RUNNER_TEMP/release-notes-$V.md"
            cp "docs/release-notes/$V.md" "$NOTES"
            SHA=$(git log -1 --format=%H -S"\"$V\"" -- manifest.json)
            if [ -z "$SHA" ]; then
              echo "No commit sets manifest.json to $V, so that version was never a release commit."
              exit 1
            fi
            BUILT=$(git show "$SHA:manifest.json" | jq -r .version)
            if [ "$BUILT" != "$V" ]; then
              echo "The last manifest change for $V is $SHA, whose manifest says $BUILT."
              exit 1
            fi
            echo "Repairing $V at $SHA"
            git checkout --force "$SHA"
            sha256sum main.js manifest.json styles.css > SHA256SUMS
            if ! git ls-remote --tags origin "refs/tags/$V" | grep -q .; then
              TAG_OBJ=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
                -f tag="$V" -f message="MCQ Tracker $V" -f object="$SHA" -f type=commit --jq .sha)
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$V" -f sha="$TAG_OBJ" >/dev/null
            fi
            gh release create "$V" main.js manifest.json styles.css SHA256SUMS \
              --title "$V" --notes-file "$NOTES"
          done
